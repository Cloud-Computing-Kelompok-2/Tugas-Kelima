# API Gateway + Load Balancer lokal (Docker Compose).
# Di AWS peran ini diganti API Gateway (HTTP API) + Application Load Balancer.
# Pertemuan 5: Routing aset statis ke CDN Edge Node ditambahkan.
resolver 127.0.0.11 valid=5s ipv6=off;   # DNS Docker: tiap replika service ikut terdeteksi saat di-scale

# Zona rate limit (api, login) didefinisikan di conf.d/00-limits.conf (gateway/limits.conf).
# Saat stress test, file itu diganti limits-stress.conf lewat docker-compose.stress.yml.

upstream auth_backend {
  zone auth_backend 64k;
  server auth-service:3000 resolve;
  keepalive 64;
}

upstream exam_backend {
  zone exam_backend 64k;
  server exam-service:3000 resolve;
  keepalive 64;
}

upstream session_backend {
  zone session_backend 64k;
  server session-service:3000 resolve;
  keepalive 128;
}

# CDN Edge Node upstream (Pertemuan 5)
upstream cdn_backend {
  zone cdn_backend 32k;
  server cdn-edge:80 resolve;
  keepalive 32;
}

server {
  listen 80;
  server_tokens off;
  # Make proxy rate limiting distinguishable from a failing upstream.
  limit_req_status 429;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 10s;
  proxy_read_timeout    30s;
  # Bila satu replika gagal, request diulang ke replika lain (hanya method idempoten).
  proxy_next_upstream         error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries   3;
  proxy_next_upstream_timeout 10s;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # ---- Pertemuan 5: Aset statis ke CDN Edge Node ----
  # GET /static/* → CDN Edge → MinIO (browser tidak langsung ke MinIO)
  location /static/ {
    # Teruskan ke CDN Edge dengan path /cdn/cbt-assets/<sisa-path>
    rewrite ^/static/(.*) /cdn/cbt-assets/$1 break;
    proxy_pass http://cdn_backend;
    proxy_set_header Host cdn-edge;
    # Jangan rate-limit aset statis (throughput tinggi)
    # Tambahkan header cache ke klien
    add_header X-Served-By "cbt-cdn-edge" always;
  }

  # Frontend statis (SPA)
  location / { try_files $uri /index.html; }

  # Endpoint internal antar-service tidak boleh diakses dari luar
  location /internal { return 404; }

  location = /api/login {
    limit_req zone=login burst=1000 nodelay;
    proxy_pass http://auth_backend;
  }
  location ~ ^/api/(me|logout)$ {
    limit_req zone=api burst=2000 nodelay;
    proxy_pass http://auth_backend;
  }
  location /api/exams {
    limit_req zone=api burst=2000 nodelay;
    proxy_pass http://exam_backend;
  }
  # Pertemuan 5: endpoint upload aset (presigned URL)
  location /api/assets {
    limit_req zone=api burst=500 nodelay;
    proxy_pass http://exam_backend;
  }
  location /api/sessions {
    limit_req zone=api burst=2000 nodelay;
    proxy_pass http://session_backend;
  }
}
