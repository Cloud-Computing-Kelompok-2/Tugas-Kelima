# ============================================================
# CDN Edge Node – Nginx Reverse Proxy ke MinIO
# Pertemuan 5: File Management & CDN berbasis Docker
# ============================================================
# Peran: meneruskan permintaan GET aset ke MinIO, menambahkan
#        header cache (Cache-Control, ETag, X-Cache), dan
#        menyimpan file ke cache disk lokal Nginx.
# ============================================================

proxy_cache_path /var/cache/nginx/cdn
  levels=1:2
  keys_zone=cdn_zone:10m
  max_size=512m
  inactive=7d
  use_temp_path=off;

server {
  listen 80;
  server_tokens off;

  # ---- Health check ringan ----
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # ---- Aset statis: proxy ke MinIO, cache di CDN ----
  # URL pola: /cdn/<bucket>/<object-path>
  location /cdn/ {
    # Hapus prefix /cdn sebelum diteruskan ke MinIO
    rewrite ^/cdn/(.*) /$1 break;

    proxy_pass         http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header   Host              minio:9000;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Cache disk Nginx
    proxy_cache            cdn_zone;
    proxy_cache_key        $uri;
    proxy_cache_valid      200 206 7d;
    proxy_cache_valid      404     1m;
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock       on;
    proxy_cache_lock_timeout 5s;

    # Header informatif ke klien
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-CDN-Node    "edge-01" always;

    # Cache-Control ke browser: 7 hari untuk aset statis
    add_header Cache-Control "public, max-age=604800, immutable" always;

    # Izinkan akses lintas asal (browser upload dari origin berbeda)
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  "*";
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
  }

  # Direktori lain ditolak
  location / {
    return 404 "CDN Edge Node: gunakan /cdn/<bucket>/<path>";
  }
}

